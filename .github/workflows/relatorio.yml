name: Relatório de Analista Movidesk

on:
  workflow_dispatch:
    inputs:
      nome_analista:
        description: 'Nome completo do Analista no Movidesk'
        required: true
        type: string

jobs:
  gerar-e-enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Buscar tickets no Movidesk e gerar relatório via Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MOVIDESK_TOKEN: ${{ secrets.MOVIDESK_TOKEN }}
        run: python script.py "${{ inputs.nome_analista }}"

      - name: Enviar E-mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Análise Movidesk (30 dias) - ${{ inputs.nome_analista }}"
          to: ${{ secrets.EMAIL_USER }}
          from: "Automação Movidesk <${{ secrets.EMAIL_USER }}>"
          html_body: file://relatorio.html
